<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="AMSOULNESS animated neon banner">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090915"/><stop offset=".55" stop-color="#17102d"/><stop offset="1" stop-color="#080b17"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#9c74ff"/><stop offset=".5" stop-color="#62e8e0"/><stop offset="1" stop-color="#bd83ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9e84d4" stroke-opacity=".11"/></pattern>
</defs>
<rect width="1000" height="280" rx="22" fill="url(#bg)"/><rect width="1000" height="280" rx="22" fill="url(#grid)"/>
<circle cx="130" cy="140" r="95" fill="none" stroke="#a78bfa" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 10"><animateTransform attributeName="transform" type="rotate" from="0 130 140" to="360 130 140" dur="26s" repeatCount="indefinite"/></circle>
<circle cx="870" cy="140" r="100" fill="none" stroke="#64e7df" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="360 870 140" to="0 870 140" dur="22s" repeatCount="indefinite"/></circle>
<path d="M-60 220 Q250 80 520 160 T1060 90" fill="none" stroke="#9c74ff" stroke-width="3" opacity=".25" filter="url(#glow)"/>
<path d="M-60 220 Q250 80 520 160 T1060 90" fill="none" stroke="url(#neon)" stroke-width="1.4" stroke-dasharray="12 22" opacity=".65"><animate attributeName="stroke-dashoffset" from="0" to="-136" dur="7s" repeatCount="indefinite"/></path>
<g fill="#8e7bc5"><circle cx="125" cy="85" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="865" cy="215" r="4"><animate attributeName="opacity" values="1;.15;1" dur="4s" repeatCount="indefinite"/></circle></g>
<text x="500" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" letter-spacing="7" fill="url(#neon)">AMSOULNESS</text>
<text x="500" y="161" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="7" fill="#ded5fa">DESIGN  ×  CODE  ×  CURIOSITY</text>
<rect x="350" y="190" width="300" height="1" fill="url(#neon)" opacity=".7"/>
<text x="500" y="226" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="3" fill="#aaa3c9">BUILD SOMETHING THAT FEELS ALIVE<tspan fill="#70e8dc">_</tspan></text>
<rect x="9" y="9" width="982" height="262" rx="16" fill="none" stroke="#a78bfa" stroke-opacity=".25"/>
</svg>