<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Animated creative workflow: imagine, design, develop, refine">
<rect width="900" height="210" rx="18" fill="#0d1020"/>
<path d="M100 100H800" stroke="#7166a4" stroke-width="2" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" from="0" to="-85" dur="6s" repeatCount="indefinite"/></path>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<g><circle cx="125" cy="100" r="36" fill="#2c1f55" stroke="#a78bfa" stroke-width="2"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></circle><text x="125" y="106" font-size="19" fill="#fff">✦</text><text x="125" y="164" font-size="16" fill="#d7c9ff">IMAGINE</text></g>
<g><circle cx="340" cy="100" r="36" fill="#1b3850" stroke="#67e8f9" stroke-width="2"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="4s" begin="1s" repeatCount="indefinite"/></circle><text x="340" y="106" font-size="20" fill="#fff">◇</text><text x="340" y="164" font-size="16" fill="#c5f5ff">DESIGN</text></g>
<g><circle cx="555" cy="100" r="36" fill="#2c1f55" stroke="#a78bfa" stroke-width="2"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="4s" begin="2s" repeatCount="indefinite"/></circle><text x="555" y="106" font-size="19" fill="#fff">&lt;/&gt;</text><text x="555" y="164" font-size="16" fill="#d7c9ff">DEVELOP</text></g>
<g><circle cx="770" cy="100" r="36" fill="#1b3850" stroke="#67e8f9" stroke-width="2"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="4s" begin="3s" repeatCount="indefinite"/></circle><text x="770" y="106" font-size="19" fill="#fff">↗</text><text x="770" y="164" font-size="16" fill="#c5f5ff">REFINE</text></g>
</g><rect x="8" y="8" width="884" height="194" rx="13" fill="none" stroke="#6d5c9d" stroke-opacity=".25"/>
</svg>