    <meta name="theme-color" content="#090711" />
    <script>
      try {
        const preference = localStorage.getItem('aslns-theme-preference') || 'system';
        const systemTheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const theme = preference === 'light' || preference === 'dark' ? preference : systemTheme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f5fc' : '#090711';
      } catch {}
    </script>
